services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: metatray
      POSTGRES_USER: metatray
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set a local development database password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["metatray-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metatray -d metatray"]
      interval: 5s
      timeout: 3s
      retries: 10
  indexer:
    profiles: ["market"]
    build:
      context: .
      dockerfile: services/Dockerfile.indexer
    env_file: .env
    restart: unless-stopped
  tribe:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: services/tribe/Dockerfile
    env_file: .env
    gpus: all
    volumes: ["metatray-models:/models", "metatray-cache:/cache", "metatray-artifacts:/data/metatray"]
    restart: unless-stopped
volumes:
  metatray-postgres:
  metatray-models:
  metatray-cache:
  metatray-artifacts:
